name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Public by design — these ship in the client bundle on the live site.
  NEXT_PUBLIC_SANITY_PROJECT_ID: bp7esa39
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
